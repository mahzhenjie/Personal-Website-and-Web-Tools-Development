<!DOCTYPE html>
<html>
    <head>
        <title>Income Tax Calculator</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <style>
            body{
                font-family: Arial;
                padding: 30px;
                background-color: white;
            }

            .box{
                width: 400px;
                padding: 20px;
                margin: auto;
                border-radius: 10px;
                box-shadow: 0px 0px 10px gray;
            }

            h1{
                text-align: center;
                color: darkblue;
            }

            input, button{
                width: 100%;
                padding: 10px;
                margin-top: 10px;
                font-size: 15px;
            }

            button{
                background-color: darkblue;
                color: white;
                cursor: pointer;
            }

            #result{
                margin-top: 20px;
                font-size: 20px;
                font-weight: bold;
                text-align: center;
                color: green;
            }

            .back-btn{
                width: auto;
                padding: 8px 15px;
                font-size: 14px;
                margin-bottom: 10px;
            }
        </style>
    </head>

    <body>
        <div class="box">
            <a href="Tools.html" class="btn btn-dark w-100 mb-3">Back to Useful Tools</a>

            <h1>Income Tax Calculator</h1>
            
            <label>Enter Yearly Income (RM):</label>
            <input type="number" id="income" placeholder="Enter income">
            <button onclick="calculateTax()">Calculate Tax</button>
            <div id="result"></div>
        </div>

        <script>
            function calculateTax(){
                let income = parseFloat(document.getElementById("income").value);
                let tax = 0;

                if(income <= 5000){
                    tax = 0;
                }

                else if(income <= 20000){
                    tax = (income - 5000) * 0.01;
                }

                else if(income <= 35000){
                    tax = 150 + (income - 20000) * 0.03;
                }

                else if(income <= 50000){
                    tax = 600 + (income - 35000) * 0.08;
                }

                else if(income <= 70000){
                    tax = 1800 + (income - 50000) * 0.13;
                }

                else if(income <= 100000){
                    tax = 4400 + (income - 70000) * 0.21;
                }

                else if(income <= 250000){
                    tax = 10700 + (income - 100000) * 0.24;
                }

                else if(income <= 400000){
                    tax = 46700 + (income - 250000) * 0.245;
                }

                else if(income <= 600000){
                    tax = 83450 + (income - 400000) * 0.25;
                }

                else if(income <= 1000000){
                    tax = 133450 + (income - 600000) * 0.26;
                }

                else if(income <= 2000000){
                    tax = 237450 + (income - 1000000) * 0.28;
                }

                else{
                    tax = 517450 + (income - 2000000) * 0.30;
                }

                document.getElementById("result").innerHTML = "Tax Amount = RM " + tax.toFixed(2);
            }
        </script>
    </body>
</html>
