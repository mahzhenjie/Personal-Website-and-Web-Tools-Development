<!DOCTYPE html>
<html>
    <head>
        <title>Unit Converter</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <style>
            body{
                font-family: Arial;
                background-color: white;
            }

            .box{
                width: 400px;
                margin: auto;
                margin-top: 60px;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0px 0px 10px gray;
            }

            h1{
                text-align: center;
                margin-bottom: 20px;
            }

            input{
                margin-bottom: 20px;
            }

            .btn-group{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            #answer{
                margin-top: 20px;
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                color: green;
            }
        </style>
    </head>

    <body>
        <div class="box">
            <a href="Tools.html" class="btn btn-dark w-100 mb-3">Back to Useful Tools</a>

            <h1>Unit Converter</h1>

            <input type="number" id="value" class="form-control" placeholder="Enter value">

            <div class="btn-group">

                <button onclick="cmToM()" class="btn btn-primary">cm to metre</button>
                <button onclick="mToCm()" class="btn btn-success">metre to cm</button>
                <button onclick="mToKm()" class="btn btn-warning">metre to km</button>
                <button onclick="kmToM()" class="btn btn-danger">km to metre</button>
            </div>
            <button onclick="clearData()"class="btn btn-secondary mt-3 w-100">Clear</button>

            <p id="answer"></p>
        </div>
        
        <script>
            function cmToM(){
                let v = Number(document.getElementById("value").value);
                document.getElementById("answer").innerHTML = (v / 100).toFixed(2) + " metre";
            }

            function mToCm(){
                let v = Number(document.getElementById("value").value);
                document.getElementById("answer").innerHTML = v * 100 + " cm";
            }

            function mToKm(){
                let v = Number(document.getElementById("value").value);
                document.getElementById("answer").innerHTML = v / 1000 + " km";
            }

            function kmToM(){
                let v = Number(document.getElementById("value").value);
                document.getElementById("answer").innerHTML = v * 1000 + " metre";
            }
        </script>
    </body>
</html>
