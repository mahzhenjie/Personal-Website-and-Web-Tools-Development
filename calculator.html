<!DOCTYPE html>
<html>
    <head>
        <title>Simple Calculator</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <style>
            body{
                font-family: Arial;
                background-color: white;
            }

            .box{
                width: 400px;
                margin: auto;
                margin-top: 60px;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0px 0px 10px gray;
            }

            h1{
                text-align: center;
                margin-bottom: 20px;
            }

            input{
                margin-bottom: 15px;
            }

            .btn-group{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
        </style>
    </head>

    <body>

        <div class="box">
            <a href="Tools.html" class="btn btn-dark w-100 mb-3">Back to Useful Tools</a>

            <h1>Simple Calculator</h1>

            <label>First Number:</label>
            <input type="text" id="num1" class="form-control">

            <label>Second Number:</label>
            <input type="text" id="num2" class="form-control">

            <label>Result:</label>
            <input type="text" id="result" class="form-control" readonly>

            <div class="btn-group mt-3">
                <button onclick="add()" class="btn btn-primary">Add</button>
                <button onclick="subtract()" class="btn btn-success">Subtract</button>
                <button onclick="multiply()" class="btn btn-warning">Multiply</button>
                <button onclick="divide()" class="btn btn-danger">Divide</button>
            </div>
            <button onclick="clearData()" class="btn btn-secondary w-100 mt-3">Clear</button>
        </div>
        
        <script>
            function add(){
                let a = parseFloat(document.getElementById("num1").value);
                let b = parseFloat(document.getElementById("num2").value);
                document.getElementById("result").value = a + b;
            }

            function subtract(){
                let a = parseFloat(document.getElementById("num1").value);
                let b = parseFloat(document.getElementById("num2").value);
                document.getElementById("result").value = a - b;
            }

            function multiply(){
                let a = parseFloat(document.getElementById("num1").value);
                let b = parseFloat(document.getElementById("num2").value);
                document.getElementById("result").value = a * b;
            }

            function divide(){
                let a = parseFloat(document.getElementById("num1").value);
                let b = parseFloat(document.getElementById("num2").value);
                document.getElementById("result").value = a / b;
            }

            function clearData(){
                document.getElementById("num1").value = "";
                document.getElementById("num2").value = "";
                document.getElementById("result").value = "";
            }
        </script>
    </body>
</html>
